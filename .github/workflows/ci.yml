name: Python CI

on:
  push:
    branches: 
      - cr_001      # Explicit branch
      - 'cr_*'      # Wildcard: automatically matches cr_002, cr_003, etc.
      - main
  pull_request:
    branches: 
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps: 
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Print first 5 lines of calculator.py
      run: |
        head -n 5 calculator.py

    - name: Run the calculator.py script
      working-directory: src  # 指定在 src 目录下运行
      run: |
        python calculator.py

    - name: Run tests
      working-directory: src  # 指定在 src 目录下运行
      run: |
        python -c "from calculator import add, subtract, multiply, divide; assert add(5, 3) == 8; assert subtract(5, 3) == 2; assert multiply(5, 3) == 15; assert divide(5, 3) == 5/3; print('All tests passed!')"

    - name: Publish CI SUMMARY
      run: |
        echo "CI SUMMARY"         >> $GITHUB_STEP_SUMMARY
        echo "-----------"
        echo "Python version: $(python --version)"         >> $GITHUB_STEP_SUMMARY
        echo "Installed packages:"         >> $GITHUB_STEP_SUMMARY
        pip list                           >> $GITHUB_STEP_SUMMARY